server {
  listen 8080;
  root /usr/share/nginx/html;

  # Liveness / readiness for Kubernetes: no files, no logs.
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Built files have a content hash in their name, so they can be cached "forever": a new build
  # produces new names.
  # (`expires` is used instead of `add_header Cache-Control`: nginx drops ALL server-level add_header
  # lines in any location that has its own add_header, which would silently remove the security headers.)
  location /assets/ {
    expires max;
    try_files $uri =404;
  }

  # Single-page app: any other path (/servers, /invite/abc...) is handled by the browser-side router,
  # so serve index.html. `expires -1` sends "Cache-Control: no-cache": browsers re-check it, which is
  # how a new version gets picked up.
  location / {
    expires -1;
    try_files $uri /index.html;
  }

  # Hardening headers. The CSP allows only our own scripts and connections; 'unsafe-inline' is for
  # STYLES only (Radix and the toast library set style attributes), never for scripts.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "same-origin" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
}
