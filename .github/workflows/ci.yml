name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      # `build` runs tsc in every workspace, so it is also our type check.
      - run: npm run build
      - run: npm test
      - uses: azure/setup-helm@v4
      # Lint once per values file: this is the only difference between local and prod.
      - run: helm lint charts/platform -f charts/platform/values-local.yaml
      - run: helm lint charts/platform -f charts/platform/values-prod.yaml
      - run: helm lint charts/store -f charts/store/values-local.yaml
      - run: helm lint charts/store -f charts/store/values-prod.yaml

  # Only on pushes to main; pull requests never get write access to the registry.
  images:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - { app: gateway, file: docker/node-service.Dockerfile }
          - { app: woo-mcp, file: docker/node-service.Dockerfile }
          - { app: mcp-fx, file: docker/node-service.Dockerfile }
          - { app: mcp-notes, file: docker/node-service.Dockerfile }
          - { app: dashboard, file: docker/dashboard.Dockerfile }
    steps:
      - uses: actions/checkout@v4
      # GHCR requires lowercase image names; the repo owner may contain capitals.
      - run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.app }}" >> "$GITHUB_ENV"
      # QEMU lets the amd64 runner build the arm64 half of the multi-arch image.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          build-args: APP=${{ matrix.app }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
