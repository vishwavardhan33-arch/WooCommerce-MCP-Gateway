{{- /*
Generated bearer tokens, rendered only when no existingSecret is given.
`lookup` reads the live Secret, so `helm upgrade` re-renders the SAME token instead of rolling a new
random one (which would silently break the gateway, which has the old token stored).
Caveat: `lookup` returns nothing under `helm template` and in GitOps tools that render offline;
use existingSecret there (scripts/bootstrap-secrets.sh creates them).
resource-policy: keep -> the Secret outlives `helm uninstall`.
*/ -}}
{{- if and .Values.mcpFx.enabled (not .Values.secrets.mcpFx.existingSecret) }}
{{- $name := include "platform.mcpFxSecret" . }}
{{- $old := lookup "v1" "Secret" .Release.Namespace $name }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "platform.labels" (dict "ctx" . "component" "secrets") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  MCP_AUTH_TOKEN: {{ dig "data" "MCP_AUTH_TOKEN" (randAlphaNum 48 | b64enc) $old }}
{{- end }}
{{- if and .Values.mcpNotes.enabled (not .Values.secrets.mcpNotes.existingSecret) }}
{{- $name := include "platform.mcpNotesSecret" . }}
{{- $old := lookup "v1" "Secret" .Release.Namespace $name }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "platform.labels" (dict "ctx" . "component" "secrets") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  MCP_AUTH_TOKEN: {{ dig "data" "MCP_AUTH_TOKEN" (randAlphaNum 48 | b64enc) $old }}
{{- end }}
