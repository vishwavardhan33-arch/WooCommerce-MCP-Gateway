{{- /*
Generated Secrets, rendered only when no existingSecret is given.
`lookup` reads the live Secret, so `helm upgrade` re-renders the SAME values instead of rolling new
random ones (which would lock the app out of a database that already has the old password).
Caveat: `lookup` returns nothing under `helm template` and in GitOps tools that render offline;
use existingSecret there.
resource-policy: keep -> the Secret outlives `helm uninstall`, like the database volume it protects.
*/ -}}
{{- if not .Values.secrets.db.existingSecret }}
{{- $name := include "store.dbSecret" . }}
{{- $old := lookup "v1" "Secret" .Release.Namespace $name }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "store.labels" (dict "ctx" . "component" "secrets") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  MYSQL_ROOT_PASSWORD: {{ dig "data" "MYSQL_ROOT_PASSWORD" (randAlphaNum 32 | b64enc) $old }}
  MYSQL_PASSWORD: {{ dig "data" "MYSQL_PASSWORD" (randAlphaNum 32 | b64enc) $old }}
{{- end }}
{{- if not .Values.secrets.wpAdmin.existingSecret }}
{{- $name := include "store.wpAdminSecret" . }}
{{- $old := lookup "v1" "Secret" .Release.Namespace $name }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "store.labels" (dict "ctx" . "component" "secrets") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  WP_ADMIN_PASSWORD: {{ dig "data" "WP_ADMIN_PASSWORD" (randAlphaNum 24 | b64enc) $old }}
{{- end }}
{{- if and .Values.mcp.enabled (not .Values.secrets.mcpAuth.existingSecret) }}
{{- $name := include "store.mcpAuthSecret" . }}
{{- $old := lookup "v1" "Secret" .Release.Namespace $name }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "store.labels" (dict "ctx" . "component" "secrets") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  MCP_AUTH_TOKEN: {{ dig "data" "MCP_AUTH_TOKEN" (randAlphaNum 48 | b64enc) $old }}
{{- end }}
