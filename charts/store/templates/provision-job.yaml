apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "store.fullname" . }}-provision
  labels:
    {{- include "store.labels" (dict "ctx" . "component" "provision") | nindent 4 }}
  annotations:
    # Runs after the chart's resources exist, on first install AND on every upgrade.
    "helm.sh/hook": post-install,post-upgrade
    # Delete the previous Job before creating a new one and when it succeeds; a FAILED Job is
    # kept so `kubectl logs job/...` still works.
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  activeDeadlineSeconds: {{ .Values.provision.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "store.labels" (dict "ctx" . "component" "provision") | nindent 8 }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "store.fullname" . }}-provision
      automountServiceAccountToken: true     # needed to write the bot Secret
      securityContext:
        # wordpress:cli is Alpine (www-data = 82) but the WordPress image is Debian (www-data = 33).
        # Running as 33 makes the files wp-cli writes owned by the user Apache runs as.
        runAsNonRoot: true
        runAsUser: 33
        runAsGroup: 33
        fsGroup: 33
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      # The volume is ReadWriteOnce: only pods on the node that already mounts it may use it.
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  {{- include "store.selectorLabels" (dict "ctx" . "component" "wordpress") | nindent 18 }}
      containers:
        - name: provision
          image: "{{ .Values.provision.image.repository }}:{{ .Values.provision.image.tag }}"
          imagePullPolicy: {{ .Values.provision.image.pullPolicy }}
          command: ["bash", "/scripts/provision.sh"]
          env:
            {{- include "store.wordpressEnv" . | nindent 12 }}
            - name: SITE_URL
              value: {{ include "store.siteUrl" . | quote }}
            - name: SITE_TITLE
              value: {{ .Values.site.title | quote }}
            - name: ADMIN_USER
              value: {{ .Values.site.adminUser | quote }}
            - name: ADMIN_EMAIL
              value: {{ .Values.site.adminEmail | quote }}
            - name: WP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "store.wpAdminSecret" . }}
                  key: WP_ADMIN_PASSWORD
            - name: WC_VERSION
              value: {{ .Values.woocommerce.version | quote }}
            - name: BOT_USER
              value: {{ .Values.mcpBot.username | quote }}
            - name: BOT_APP_NAME
              value: {{ .Values.mcpBot.appName | quote }}
            - name: BOT_SECRET
              value: {{ include "store.botSecret" . | quote }}
            # The current bot password, if the Secret exists. optional: true -> unset on first install.
            - name: EXISTING_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "store.botSecret" . }}
                  key: password
                  optional: true
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: APP_PASSWORD_OUT
              value: /tmp/mcp-bot-app-password
            # Read-only root filesystem: give wp-cli a writable home and cache under /tmp.
            - name: HOME
              value: /tmp
            - name: WP_CLI_CACHE_DIR
              value: /tmp/wp-cli-cache
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: wordpress-data
              mountPath: /var/www/html
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.provision.resources | nindent 12 }}
      volumes:
        - name: wordpress-data
          persistentVolumeClaim:
            claimName: {{ include "store.fullname" . }}-wordpress
        - name: scripts
          configMap:
            name: {{ include "store.fullname" . }}-scripts
        - name: tmp
          emptyDir: {}
